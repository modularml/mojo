model:
  model_path: google/gemma-4-12B-it
  device_specs: [0]
  max_length: 8192
  kv_cache:
    device_memory_utilization: 0.75

draft_model:
  model_path: deepseek-ai/dspark_gemma4_12b_block7
  device_specs: [0]
  quantization_encoding: bfloat16

# DSpark drafts a full 7-token block per step (block_size in the draft
# checkpoint config); num_speculative_tokens must match it.
speculative:
  speculative_method: dflash
  num_speculative_tokens: 7

runtime:
  device_graph_capture: true
