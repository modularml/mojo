model:
  model_path: google/gemma-4-12B-it
  device_specs: [0]
  max_length: 8192
  kv_cache:
    device_memory_utilization: 0.75

# Compiles the language graph through device-graph synthesis: the compiled
# model records its kernels into a device graph and replays it on execute.
# Mutually exclusive with device_graph_capture (this arch's default), which
# the config resolution disables when synthesis is set.
runtime:
  experimental_device_graph_synthesis: true
