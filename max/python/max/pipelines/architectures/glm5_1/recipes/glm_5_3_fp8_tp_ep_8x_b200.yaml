# 8x B200 recipe for GLM-5.3 (FP8).
#
# data_parallel_degree is 1 because DP corrupts output on this checkpoint; TP
# is the safe choice until that is root-caused. No speculative section: MTP
# acceptance on FP8 weights is too low to pay for itself.
model:
  model_path: zai-org/GLM-5.3
  device_specs: [0, 1, 2, 3, 4, 5, 6, 7]
  quantization_encoding: float8_e4m3fn
  data_parallel_degree: 1
  max_length: 192000  # 756 GB of weights OOM above roughly this at EP8.
  kv_cache:
    kv_cache_format: float8_e4m3fn
    device_memory_utilization: 0.78

runtime:
  ep_size: 8
  max_batch_input_tokens: 2048
  max_batch_size: 8

sampling:
  enable_structured_output: true
