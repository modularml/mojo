# 2x B200 recipe for Inkling Small NVFP4 with MTP (K=2).
model:
  model_path: thinkingmachines/Inkling-Small-NVFP4
  device_specs: [0, 1]
  quantization_encoding: float4_e2m1fnx2
  trust_remote_code: true
  max_length: 8192
  kv_cache:
    device_memory_utilization: 0.95
    enable_prefix_caching: false

runtime:
  max_batch_size: 64

speculative:
  speculative_method: mtp
  num_speculative_tokens: 2
