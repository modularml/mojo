openapi: 3.1.0
info:
  title: MAX REST API reference
  description: |

    The MAX REST API provides an OpenAI-compatible REST endpoint for deploying
    LLMs and other GenAI models locally or in the cloud.

paths:
  /v1/responses:
    post:
      operationId: createResponse
      summary: Create response
      description: |
        Creates a response for the given input. Supports image generation
        (text-to-image, image-to-image), video generation (text-to-video,
        image-to-video), and audio generation. This endpoint follows the
        [Open Responses](https://huggingface.co/blog/open-responses)
        specification.

        To enable this endpoint, set the `MAX_SERVE_API_TYPES` environment
        variable:

        ```
        export MAX_SERVE_API_TYPES='["responses"]'
        ```

        For detailed usage examples, see the
        [image generation guide](/serve/image-generation), the
        [video generation guide](/serve/video-generation), and the
        [audio generation guide](/serve/audio-generation).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - input
              properties:
                model:
                  type: string
                  description: |
                    ID of the model to use. Determines whether image or video
                    provider options apply.
                input:
                  description: |
                    Input for the request. Use a plain string for text-only
                    generation. Use a structured message array to include an
                    image (for image-to-image or image-to-video workflows).
                  oneOf:
                    - type: string
                      description: Text prompt for text-to-image or text-to-video generation.
                    - type: array
                      description: |
                        Structured message array for image input workflows.
                        Each message has a `role` and a `content` array of
                        typed content parts.
                      items:
                        type: object
                        required:
                          - role
                          - content
                        properties:
                          role:
                            type: string
                            enum: [user]
                          content:
                            type: array
                            items:
                              type: object
                              required:
                                - type
                              properties:
                                type:
                                  type: string
                                  enum: [input_image, input_text]
                                image_url:
                                  type: string
                                  description: |
                                    URL or base64 data URI of the input image.
                                    Required when `type` is `input_image`.
                                    Format: `https://…` or
                                    `data:<mime-type>;base64,<data>`.
                                text:
                                  type: string
                                  description: |
                                    Text prompt or transformation instruction.
                                    Required when `type` is `input_text`.
                provider_options:
                  type: object
                  description: |
                    Provider-specific generation options. Use the `image` key
                    for image generation models, the `video` key for video
                    generation models, and the `audio` key for audio
                    generation models. The `max` key applies to all models.
                  properties:
                    image:
                      type: object
                      description: Options for image generation models.
                      properties:
                        height:
                          type: integer
                          description: |
                            Output image height in pixels. Must be at least 128
                            and a multiple of 8. Defaults to the model's
                            native resolution.
                          minimum: 128
                        width:
                          type: integer
                          description: |
                            Output image width in pixels. Must be at least 128
                            and a multiple of 8. Defaults to the model's
                            native resolution.
                          minimum: 128
                        steps:
                          type: integer
                          description: |
                            Number of denoising steps. More steps produce
                            higher quality but take longer. Defaults to the
                            model's recommended value.
                          minimum: 1
                        guidance_scale:
                          type: number
                          description: |
                            Prompt adherence strength. Higher values (7–10)
                            follow the prompt more closely; lower values (1–3)
                            allow more creative variation.
                          default: 3.5
                          minimum: 0.0
                        negative_prompt:
                          type: string
                          description: |
                            Text describing what to avoid in the output. Best
                            practice is to put all negative guidance here
                            rather than in the main prompt.
                        secondary_prompt:
                          type: string
                          description: |
                            Second text prompt passed to the second text
                            encoder. Supported by FLUX and Z-Image models;
                            ignored by others.
                        secondary_negative_prompt:
                          type: string
                          description: |
                            Second negative prompt passed to the second text
                            encoder. Supported by FLUX and Z-Image models;
                            ignored by others.
                        num_images:
                          type: integer
                          description: Number of images to generate per request.
                          default: 1
                          minimum: 1
                        strength:
                          type: number
                          description: |
                            Image-to-image denoising strength in the range
                            (0, 1]. Higher values add more noise and preserve
                            less of the input image. Ignored for text-to-image
                            requests.
                          default: 0.6
                          exclusiveMinimum: 0.0
                          maximum: 1.0
                        output_format:
                          type: string
                          description: Encoding format for the output image.
                          default: jpeg
                          enum: [jpeg, png, webp]
                        true_cfg_scale:
                          type: number
                          description: |
                            True classifier-free guidance scale. Enabled when
                            greater than 1.0 and `negative_prompt` is set.
                          default: 1.0
                          exclusiveMinimum: 0.0
                        cfg_normalization:
                          type: boolean
                          description: |
                            Clip the guided prediction norm to the positive
                            prediction norm during CFG.
                          default: false
                        cfg_truncation:
                          type: number
                          description: |
                            Disable CFG for timesteps where the normalized
                            time `t_norm` exceeds this value.
                          default: 1.0
                          exclusiveMinimum: 0.0
                        residual_threshold:
                          type: number
                          description: |
                            First-block cache (FBCache) reuse threshold.
                            Lower values skip fewer denoising steps (higher
                            quality, slower). Uses the model default when
                            omitted. Requires `--first-block-caching` at
                            server startup.
                          exclusiveMinimum: 0.0
                        response_format:
                          type: string
                          description: |
                            How the generated image is returned.
                            `b64_json` — base64-encoded image data returned
                            inline in `output[0].content[0].image_data`.
                            `url` — the server saves the image and returns a
                            download URL.
                          default: b64_json
                          enum: [b64_json, url]
                    video:
                      type: object
                      description: Options for video generation models.
                      properties:
                        height:
                          type: integer
                          description: |
                            Output video height in pixels. Defaults to the
                            model's native resolution.
                          minimum: 1
                        width:
                          type: integer
                          description: |
                            Output video width in pixels. Defaults to the
                            model's native resolution.
                          minimum: 1
                        num_frames:
                          type: integer
                          description: |
                            Number of frames to generate. Total duration equals
                            `num_frames / frames_per_second`. Defaults to the
                            model's recommended clip length.
                          minimum: 1
                        frames_per_second:
                          type: integer
                          description: Frame rate of the output video in fps.
                          default: 16
                          minimum: 1
                        steps:
                          type: integer
                          description: |
                            Number of denoising steps. More steps produce
                            higher quality but take longer. Defaults to the
                            model's recommended value.
                          minimum: 1
                        guidance_scale:
                          type: number
                          description: |
                            Prompt adherence strength. Higher values (7–10)
                            follow the prompt more closely; lower values (1–3)
                            allow more creative variation.
                          default: 3.5
                          minimum: 0.0
                        guidance_scale_2:
                          type: number
                          description: |
                            Secondary guidance scale applied at a boundary
                            timestep. Supported by Wan models; ignored by
                            others.
                          exclusiveMinimum: 0.0
                        negative_prompt:
                          type: string
                          description: |
                            Text describing what to avoid in the output.
                        true_cfg_scale:
                          type: number
                          description: |
                            True classifier-free guidance scale. Enabled when
                            greater than 1.0 and `negative_prompt` is set.
                          default: 1.0
                          exclusiveMinimum: 0.0
                        cfg_normalization:
                          type: boolean
                          description: |
                            Clip the guided prediction norm to the positive
                            prediction norm during CFG.
                          default: false
                        cfg_truncation:
                          type: number
                          description: |
                            Disable CFG for timesteps where the normalized
                            time `t_norm` exceeds this value.
                          default: 1.0
                          exclusiveMinimum: 0.0
                        residual_threshold:
                          type: number
                          description: |
                            First-block cache (FBCache) reuse threshold.
                            Lower values skip fewer denoising steps (higher
                            quality, slower). Uses the model default when
                            omitted. Requires `--first-block-caching` at
                            server startup.
                          exclusiveMinimum: 0.0
                        response_format:
                          type: string
                          description: |
                            How the generated video is returned.
                            `url` — the server saves the video to a temporary
                            file and returns a download URL at
                            `/v1/videos/{video_id}/content`.
                            `b64_json` — base64-encoded mp4 data returned
                            inline in `output[0].content[0].video_data`.
                          default: url
                          enum: [url, b64_json]
                    audio:
                      type: object
                      description: |
                        Configuration options for audio generation models.
                      properties:
                        lyrics:
                          type: string
                          description: |
                            The lyrics to sing. Applies to music generation
                            models.
                        audio_duration:
                          type: number
                          description: |
                            The maximum length of the generated audio, in
                            seconds. If you omit
                            this field, the model uses its default duration.
                          exclusiveMinimum: 0.0
                        steps:
                          type: integer
                          description: |
                            The number of denoising steps to run. Applies to
                            models that generate audio with a diffusion or
                            flow-matching stage. If you omit this field, the
                            model uses its default number of steps.
                          minimum: 1
                        guidance_scale:
                          type: number
                          description: |
                            The classifier-free guidance scale. If you omit
                            this field, the model uses its own scales. Audio
                            models often guide their autoregressive and
                            denoising stages at different strengths.
                          exclusiveMinimum: 0.0
                        audio_format:
                          type: string
                          description: |
                            The format for the returned audio. Only
                            `wav` is supported.
                          default: wav
                          enum: [wav]
            examples:
              textToImage:
                summary: Text-to-image generation
                value:
                  model: "black-forest-labs/FLUX.2-dev"
                  input: "A serene mountain landscape at sunset"
                  provider_options:
                    image:
                      height: 1024
                      width: 1024
                      steps: 28
              imageToImage:
                summary: Image-to-image generation
                value:
                  model: "black-forest-labs/FLUX.2-dev"
                  input:
                    - role: user
                      content:
                        - type: input_image
                          image_url: "https://example.com/input.jpg"
                        - type: input_text
                          text: "Transform this into a watercolor painting"
                  provider_options:
                    image:
                      height: 1024
                      width: 1024
                      steps: 28
              textToVideo:
                summary: Text-to-video generation
                value:
                  model: "Wan-AI/Wan2.2-T2V-A14B-Diffusers"
                  input: "A campfire crackles in a forest clearing at night, sparks spiraling upward into a star-filled sky"
                  provider_options:
                    video:
                      height: 512
                      width: 512
                      steps: 28
                      num_frames: 81
                      frames_per_second: 16
                      response_format: b64_json
              imageToVideo:
                summary: Image-to-video generation
                value:
                  model: "Wan-AI/Wan2.2-I2V-A14B-Diffusers"
                  input:
                    - role: user
                      content:
                        - type: input_image
                          image_url: "data:image/png;base64,<base64-encoded-image>"
                        - type: input_text
                          text: "The campfire grows larger, sparks spiraling upward"
                  provider_options:
                    video:
                      height: 512
                      width: 512
                      steps: 28
                      num_frames: 81
                      frames_per_second: 16
                      response_format: b64_json
              audioGeneration:
                summary: Music generation from a caption and lyrics
                value:
                  model: "MiniMaxAI/MiniMax-Music3"
                  input: "Global Metadata: dream pop, 92 BPM, A minor. Vocal Details: female lead, airy breathy timbre. Arrangement: shimmering electric guitar, soft brushed drums."
                  seed: 1235
                  provider_options:
                    audio:
                      lyrics: "[verse]\nHeadlights paint the empty road\n[chorus]\nHold the night a little longer"
                      audio_duration: 30
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Unique identifier for the response.
                  object:
                    type: string
                    description: Always `response`.
                  created_at:
                    type: integer
                    description: Unix timestamp of when the response was created.
                  model:
                    type: string
                    description: Model used to generate the response.
                  status:
                    type: string
                    description: Completion status of the response.
                  output:
                    type: array
                    description: |
                      List of output messages. Each message has a `content`
                      array containing one or more generated items.
                    items:
                      type: object
                      properties:
                        role:
                          type: string
                          description: Always `assistant`.
                        content:
                          type: array
                          items:
                            type: object
                            properties:
                              image_data:
                                type: string
                                description: |
                                  Base64-encoded image data. Present when
                                  `provider_options.image.response_format` is
                                  `b64_json` (the default for image models).
                              video_data:
                                type: string
                                description: |
                                  Base64-encoded mp4 video data. Present when
                                  `provider_options.video.response_format` is
                                  `b64_json`.
                              video_url:
                                type: string
                                description: |
                                  URL to download the generated video. Present
                                  when `provider_options.video.response_format`
                                  is `url` (the default for video models).
                                  Download from
                                  `GET /v1/videos/{video_id}/content`.
                              type:
                                type: string
                                description: |
                                  Content-part discriminator. For audio
                                  output this is `output_audio`.
                              audio_url:
                                type: string
                                description: |
                                  URL to download the generated audio.
                              format:
                                type: string
                                description: |
                                  Format of the generated audio. Only
                                  `wav` is supported.
                              sample_rate:
                                type: integer
                                description: |
                                  Sample rate of the generated audio, in
                                  hertz.
                              num_samples:
                                type: integer
                                description: |
                                  Number of samples per channel in the
                                  generated audio.
                  usage:
                    type: object
                    description: |
                      Token and resource usage for the response. For image
                      generation, token counts are 0; see
                      `image_generation_details` for image-specific metadata.
                    properties:
                      input_tokens:
                        type: integer
                        description: The total number of input tokens.
                      output_tokens:
                        type: integer
                        description: The total number of output tokens.
                      total_tokens:
                        type: integer
                        description: The total number of input and output tokens.
                      input_tokens_details:
                        type: object
                        description: Detailed breakdown of input token counts.
                      output_tokens_details:
                        type: object
                        description: Detailed breakdown of output token counts.
                      image_generation_details:
                        type: object
                        description: |
                          Image generation metadata, present when the response
                          contains generated images.
                        required:
                          - width
                          - height
                          - megapixels
                          - steps
                          - image_count
                        properties:
                          width:
                            type: integer
                            description: The width of each generated image in pixels.
                          height:
                            type: integer
                            description: The height of each generated image in pixels.
                          megapixels:
                            type: number
                            description: The megapixels per image.
                          steps:
                            type: integer
                            description: The number of denoising steps used per image.
                          image_count:
                            type: integer
                            description: The number of images generated for the request.
                      audio_generation_details:
                        type: object
                        description: |
                          Audio generation metadata. Only present when the
                          response contains generated audio.
                        required:
                          - duration_seconds
                          - sample_rate
                          - channels
                          - num_samples
                          - steps
                        properties:
                          duration_seconds:
                            type: number
                            description: Duration of the generated audio, in seconds.
                          sample_rate:
                            type: integer
                            description: Sample rate of the generated audio, in hertz.
                          channels:
                            type: integer
                            description: Number of channels in the generated audio.
                          num_samples:
                            type: integer
                            description: Number of samples per channel.
                          steps:
                            type: integer
                            description: |
                              Number of denoising steps used to generate
                              the audio.
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      summary: Create chat completion
      description: |
        Creates a completion for the chat message. MAX supports a subset of
        OpenAI's chat completion parameters.
        Streaming is supported, but
        [chat-object](https://platform.openai.com/docs/api-reference/chat-streaming/streaming)
        and
        [chat-streaming](https://platform.openai.com/docs/api-reference/chat-streaming)
        response formats have limitations.
      x-codeSamples:
        - lang: Python
          source: |
            from openai import OpenAI

            client = OpenAI(
                base_url="http://0.0.0.0:8000/v1",
                api_key="EMPTY",
            )

            completion = client.chat.completions.create(
                model="modularai/Llama-3.1-8B-Instruct-GGUF",
                messages=[
                    {
                      "role": "user",
                      "content": "Who won the world series in 2020?"
                    },
                ],
                max_completion_tokens=100
            )

            print(completion.choices[0].message.content)
        - lang: curl
          source: |
            curl -X POST http://0.0.0.0:8000/v1/chat/completions \
              -H "Content-Type: application/json" \
              -d '{
                "model": "modularai/Llama-3.1-8B-Instruct-GGUF",
                "messages": [
                  {
                    "role": "user",
                    "content": "Who won the world series in 2020?"
                  }
                ],
                "max_completion_tokens": 100
              }'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatCompletionRequest'
            examples:
              basic:
                summary: Basic chat completion
                value:
                  model: "modularai/Llama-3.1-8B-Instruct-GGUF"
                  messages:
                    - role: "user"
                      content: "Who won the world series in 2020?"
                  max_completion_tokens: 100
              streaming:
                summary: Streaming chat completion
                value:
                  model: "modularai/Llama-3.1-8B-Instruct-GGUF"
                  messages:
                    - role: "system"
                      content: "You are a helpful assistant."
                    - role: "user"
                      content: "Write a short poem about AI."
                  stream: true
                  max_completion_tokens: 100
              withTools:
                summary: Chat completion with tools
                value:
                  model: "modularai/Llama-3.1-8B-Instruct-GGUF"
                  messages:
                    - role: "system"
                      content: "You are a helpful assistant."
                    - role: "user"
                      content: "What's the weather in San Francisco?"
                  tools:
                    - type: "function"
                      function:
                        name: "get_weather"
                        description: "Get the current weather in a given location"
                        parameters:
                          type: "object"
                          properties:
                            location:
                              type: "string"
                          required: ["location"]
                  tool_choice: "auto"
                  max_completion_tokens: 100
              jsonResponse:
                summary: Chat completion with JSON response format
                value:
                  model: "modularai/Llama-3.1-8B-Instruct-GGUF"
                  messages:
                    - role: "system"
                      content: "You are a helpful assistant."
                    - role: "user"
                      content: "Generate a JSON object with name, age, and occupation fields"
                  response_format:
                    type: "json_object"
                  max_completion_tokens: 100
              withImage:
                summary: Chat completion with image
                value:
                  model: "Qwen/Qwen2.5-VL-7B-Instruct"
                  messages:
                    - role: "system"
                      content: "You are a helpful assistant that can analyze images."
                    - role: "user"
                      content: [
                        {
                          "type": "text",
                          "text": "What's in this image?"
                        },
                        {
                          "type": "image_url",
                          "image_url": {
                            "url": "https://example.com/image.jpg",
                          }
                        }
                      ]
                  max_completion_tokens: 300
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateChatCompletionResponse'
              examples:
                basic:
                  summary: Basic chat completion response
                  value:
                    id: "bb41aa81eac24f4b9ed7ecd0ea593815"
                    object: "chat.completion"
                    created: 1743183374
                    model: "modularai/Llama-3.1-8B-Instruct-GGUF"
                    choices:
                      - index: 0
                        message:
                          role: "assistant"
                          content: "The Los Angeles Dodgers won the 2020 World Series. They defeated the Tampa Bay Rays in the series 4 games to 2. This was the Dodgers' first World Series title since 1988."
                          refusal: ""
                          tool_calls: null
                          function_call: null
                        finish_reason: "stop"
                        logprobs: { "content": [], "refusal": [] }
                    service_tier: null
                    system_fingerprint: null
                    usage:
                      completion_tokens: 17
                      prompt_tokens: null
                      total_tokens: 17
                withTools:
                  summary: Chat completion response with tool calls
                  value:
                    id: "chatcmpl-123456789"
                    object: "chat.completion"
                    created: 1677858242
                    model: "modularai/Llama-3.1-8B-Instruct-GGUF"
                    choices:
                      - index: 0
                        message:
                          role: "assistant"
                          content: null
                          tool_calls:
                            - id: "call_abc123"
                              type: "function"
                              function:
                                name: "get_weather"
                                arguments: "{\"location\":\"San Francisco, CA\"}"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/completions:
    post:
      operationId: createCompletion
      summary: Create completion
      description: |
        Creates a completion for the provided prompt.
        MAX supports a subset of OpenAI's completion parameters.
      x-codeSamples:
        - lang: Python
          source: |
            from openai import OpenAI

            client = OpenAI(
                base_url="http://0.0.0.0:8000/v1",
                api_key="EMPTY",
            )

            completion = client.completions.create(
                model="modularai/Llama-3.1-8B-Instruct-GGUF",
                prompt="Once upon a time",
                max_tokens=50
            )

            print(completion.choices[0].text)
        - lang: curl
          source: |
            curl -X POST http://0.0.0.0:8000/v1/completions \
              -H "Content-Type: application/json" \
              -d '{
                "model": "modularai/Llama-3.1-8B-Instruct-GGUF",
                "prompt": "Once upon a time",
                "max_tokens": 50
              }'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompletionRequest'
            examples:
              basic:
                summary: Basic completion
                value:
                  model: "modularai/Llama-3.1-8B-Instruct-GGUF"
                  prompt: "Once upon a time"
                  max_tokens: 50
              withEcho:
                summary: Completion with echo
                value:
                  model: "modularai/Llama-3.1-8B-Instruct-GGUF"
                  prompt: "Complete this sentence: The quick brown fox"
                  max_tokens: 20
                  echo: true
              withLogprobs:
                summary: Completion with logprobs
                value:
                  model: "modularai/Llama-3.1-8B-Instruct-GGUF"
                  prompt: "The capital of France is"
                  max_tokens: 5
                  logprobs: 5
              streaming:
                summary: Streaming completion
                value:
                  model: "modularai/Llama-3.1-8B-Instruct-GGUF"
                  prompt: "Write a short story about"
                  max_tokens: 100
                  stream: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCompletionResponse'
              examples:
                basic:
                  summary: Basic completion response
                  value:
                    id: "2dd7bad9bd1b4caea0114cb292f5b23a"
                    object: "text_completion"
                    created: 1743183506
                    model: "modularai/Llama-3.1-8B-Instruct-GGUF"
                    choices:
                      - index: 0
                        text: ", there was a brave knight who lived in a small village at the edge of a great forest. The knight was known throughout the land for his kindness and courage."
                        finish_reason: "stop"
                        logprobs:
                          text_offset: null
                          token_logprobs: []
                          tokens: null
                          top_logprobs: []
                    system_fingerprint: null
                    usage:
                      prompt_tokens: 5
                      completion_tokens: 36
                      total_tokens: 41
                withLogprobs:
                  summary: Completion response with logprobs
                  value:
                    id: "cmpl-123456789"
                    object: "text_completion"
                    created: 1677858242
                    model: "modularai/Llama-3.1-8B-Instruct-GGUF"
                    choices:
                      - index: 0
                        text: " Paris"
                        logprobs:
                          tokens: [" Paris"]
                          token_logprobs: [-0.34]
                          top_logprobs: [
                            {" Paris": -0.34, " London": -2.1, " New": -2.5}
                          ]
                          text_offset: [24]
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/embeddings:
    post:
      operationId: createEmbedding
      summary: Create embeddings
      description: |
        Creates an embedding vector representing the input text. MAX supports
        [sentence-transformers/all-mpnet-base-v2](https://huggingface.co/sentence-transformers/all-mpnet-base-v2)
        model. Only string and list of strings are supported for the
        input parameter.
      x-codeSamples:
        - lang: Python
          source: |
            from openai import OpenAI

            client = OpenAI(
                base_url="http://0.0.0.0:8000/v1",
                api_key="EMPTY",
            )

            response = client.embeddings.create(
                model="sentence-transformers/all-mpnet-base-v2",
                input="The food was delicious and the service was excellent."
            )

            print(f"Embedding vector length: {len(response.data[0].embedding)}")
            print(f"First 5 values: {response.data[0].embedding[:5]}")
        - lang: curl
          source: |
            curl -X POST http://0.0.0.0:8000/v1/embeddings \
              -H "Content-Type: application/json" \
              -d '{
                "model": "sentence-transformers/all-mpnet-base-v2",
                "input": "The food was delicious and the service was excellent."
              }'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmbeddingRequest'
            examples:
              singleString:
                summary: Single string embedding
                value:
                  model: "sentence-transformers/all-mpnet-base-v2"
                  input: "The food was delicious and the service was excellent."
              multipleStrings:
                summary: Multiple strings embedding
                value:
                  model: "sentence-transformers/all-mpnet-base-v2"
                  input: [
                    "The food was delicious and the service was excellent.",
                    "The restaurant was very expensive and the food was mediocre."
                  ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEmbeddingResponse'
              examples:
                singleString:
                  summary: Single string embedding response
                  value:
                    object: "list"
                    data: [
                      {
                        object: "embedding",
                        embedding: [0.0023064255, -0.009327292, 0.01842359, -0.0028842522, 0.0044457657],
                        index: 0
                      }
                    ]
                    model: "sentence-transformers/all-mpnet-base-v2"
                multipleStrings:
                  summary: Multiple strings embedding response
                  value:
                    object: "list"
                    data: [
                      {
                        object: "embedding",
                        embedding: [0.0023064255, -0.009327292, 0.01842359, -0.0028842522, 0.0044457657],
                        index: 0
                      },
                      {
                        object: "embedding",
                        embedding: [0.0018843175, -0.007852346, 0.02157294, -0.0031256843, 0.0051234568],
                        index: 1
                      }
                    ]
                    model: "sentence-transformers/all-mpnet-base-v2"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/audio/speech:
    post:
      operationId: createSpeech
      summary: Create speech
      description: |
        Generates audio from a text prompt. Only compatible with
        audio or music generation models.

        For a full walkthrough, see the
        [audio generation guide](/serve/audio-generation).
      x-codeSamples:
        - lang: Python
          source: |
            from openai import OpenAI

            client = OpenAI(
                base_url="http://0.0.0.0:8000/v1",
                api_key="EMPTY",
            )

            response = client.audio.speech.create(
                model="MiniMaxAI/MiniMax-Music3",
                input="[verse]\nHeadlights paint the empty road\n[chorus]\nHold the night a little longer",
                instructions="Global Metadata: dream pop, 92 BPM, A minor. Vocal Details: female lead, airy breathy timbre. Arrangement: shimmering electric guitar, soft brushed drums.",
                voice="",
                response_format="wav",
                extra_body={"audio_duration": 30, "seed": 1235},
            )

            response.write_to_file("song.wav")
        - lang: curl
          source: |
            curl -X POST http://0.0.0.0:8000/v1/audio/speech \
              -H "Content-Type: application/json" \
              -o song.wav \
              -d '{
                "model": "MiniMaxAI/MiniMax-Music3",
                "instructions": "Global Metadata: dream pop, 92 BPM, A minor. Vocal Details: female lead, airy breathy timbre. Arrangement: shimmering electric guitar, soft brushed drums.",
                "input": "[verse]\nHeadlights paint the empty road\n[chorus]\nHold the night a little longer",
                "audio_duration": 30,
                "seed": 1235
              }'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - input
                - instructions
              properties:
                model:
                  type: string
                  description: The ID of the audio generation model to use.
                input:
                  type: string
                  description: |
                    The text the model renders as audio. For a model
                    that sings, this field holds the lyrics.
                instructions:
                  type: string
                  description: |
                    A description of how the audio sounds,
                    such as the genre, tempo, key, mood, vocal, and
                    arrangement. Music models require this field.
                voice:
                  type: string
                  description: |
                    The voice to use. Exists for OpenAI compatibility only;
                    MAX accepts the field and ignores its value.
                response_format:
                  type: string
                  description: |
                    The container format for the returned audio. MAX
                    supports only `wav`. Any other value, such as `mp3`,
                    returns a `400` error.
                  default: wav
                  enum: [wav]
                audio_duration:
                  type: number
                  description: |
                    The maximum length of the generated audio, in seconds.
                    If you omit this field, the
                    model uses its own default duration.
                  default: 60
                  exclusiveMinimum: 0.0
                steps:
                  type: integer
                  description: |
                    The number of denoising steps in the flow-matching
                    stage. Higher values improve the audio quality and
                    increase the latency. If you omit this field, the model
                    uses its own default.
                  default: 30
                  minimum: 1
                guidance_scale:
                  type: number
                  description: |
                    The classifier-free guidance scale.
                  default: 1.7
                  exclusiveMinimum: 0.0
                seed:
                  type: integer
                  description: |
                    The seed for the sampling and noise draws. The same seed
                    and the same prompt reproduce the same audio.
                  default: 0
            examples:
              musicGeneration:
                summary: Music generation from a caption and lyrics
                value:
                  model: "MiniMaxAI/MiniMax-Music3"
                  input: "[verse]\nHeadlights paint the empty road\n[chorus]\nHold the night a little longer"
                  instructions: "Global Metadata: dream pop, 92 BPM, A minor. Vocal Details: female lead, airy breathy timbre. Arrangement: shimmering electric guitar, soft brushed drums."
                  audio_duration: 30
                  seed: 1235
      responses:
        '200':
          description: OK
          content:
            audio/wav:
              schema:
                type: string
                format: binary
                description: |
                  The generated audio as 16-bit PCM WAV at the model's own
                  sample rate.
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/models:
    get:
      operationId: listModels
      summary: List models
      description: |
        Lists the currently available models.
        MAX returns only the one model that it's currently serving.
      x-codeSamples:
        - lang: Python
          source: |
            from openai import OpenAI

            client = OpenAI(
                base_url="http://0.0.0.0:8000/v1",
                api_key="EMPTY",
            )

            models = client.models.list()

            for model in models.data:
                print(f"Model ID: {model.id}")
                print(f"Object Type: {model.object}")
                print(f"Owned By: {model.owned_by}")
        - lang: curl
          source: |
            curl -X GET http://0.0.0.0:8000/v1/models \
              -H "Content-Type: application/json"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListModelsResponse'
              examples:
                models:
                  summary: Models list response
                  value:
                    object: "list"
                    data: [
                      {
                        id: "modularai/Llama-3.1-8B-Instruct-GGUF",
                        object: "model",
                        created: null,
                        owned_by: ""
                      }
                    ]
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health:
    get:
      operationId: health
      summary: Health check
      description: |
        Returns the health status of the service. Used by tools like lm-eval
        to determine when the service is ready to accept requests.
      x-codeSamples:
        - lang: curl
          source: |
            curl -X GET http://0.0.0.0:8000/health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  summary: Healthy response
                  value:
                    status: "ok"
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                unhealthy:
                  summary: Unhealthy response
                  value:
                    status: "unavailable"
components:
  schemas:
    CreateChatCompletionRequest:
      type: object
      required:
        - model
        - messages
      properties:
        model:
          type: string
          description: |
            ID of the model to use.
            Supported by MAX but handled by frontend load balancer to route traffic to nodes.
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatCompletionMessage'
          description: |
            A list of messages comprising the conversation so far.
            MAX supports content and role parameters.
        max_tokens:
          type: integer
          minimum: 1
          deprecated: true
          description: |
            The maximum number of tokens to generate in the chat completion.
        max_completion_tokens:
          type: integer
          minimum: 1
          description: |
            The maximum number of tokens to generate in the chat completion.
            Preferred alias for `max_tokens`. If both are supplied,
            `max_completion_tokens` takes precedence (no error is raised).
        reasoning_effort:
          type: string
          description: |
            Controls how much effort the model spends on reasoning. Set to
            `none` to disable thinking, or `low`, `medium`, or `high` to
            control the trade-off between speed and reasoning depth. If the
            request also includes `reasoning.effort`, this field takes
            precedence.
        thinking:
          type: object
          required:
            - type
          description: |
            Controls model reasoning. Useful if the model expects `thinking`
            rather than `reasoning` parameters.
          properties:
            type:
              type: string
              enum: [enabled, disabled, adaptive]
              description: The reasoning mode.
        reasoning:
          type: object
          description: |
            Sets the reasoning configuration. See the
            [Reasoning](/serve/reasoning/) guide for more information.

            Note that some fields are non-functional and only exist
            to maintain compatibility with different providers.
          properties:
            enabled:
              type: boolean
              description: Whether to enable reasoning.
            effort:
              type: string
              description: |
                Controls reasoning effort when `reasoning.enabled` is not set.
                Set to `none` to disable thinking, or `low`, `medium`, or
                `high` to enable reasoning at the specified level. Ignored
                when `enabled` is explicitly set.
            max_tokens:
              type: integer
              description: Accepted for client compatibility. Not used by MAX Serve.
            exclude:
              type: boolean
              description: Accepted for client compatibility. Not used by MAX Serve.
        logprobs:
          type: boolean
          description: |
            Whether to return log probabilities of the output tokens or not.
        cache_salt:
          type: string
          maxLength: 512
          description: |
            Per-request salt that isolates this prompt's prefix-cache
            entries in multi-tenant deployments. Requires
            `MAX_SERVE_USE_CLIENT_CACHE_SALT` to be enabled. If both this
            field and the `X-Cache-Salt` header are present, the header
            takes precedence. Works with any `kv_cache_hash_algo`.
        response_format:
          type: object
          description: |
            An object specifying the format that the model must output.
          properties:
            type:
              type: string
              enum: [text, json_object, json_schema]
              description: The format type
            json_schema:
              type: object
              description: |
                Configuration for the `json_schema` format type. Set this when
                `type` is `json_schema`.
              properties:
                schema:
                  oneOf:
                    - type: object
                    - type: boolean
                  description: |
                    The JSON Schema that the output must match. This value can
                    be a JSON Schema object or a boolean. `true` accepts any
                    value. `false` can't be satisfied, so MAX returns a `400`
                    error.
        stream:
          type: boolean
          default: false
          description: |
            If set, partial message deltas will be sent.
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ChatCompletionTool'
          description: |
            A list of tools the model may call.
        tool_choice:
          oneOf:
            - type: string
              enum: [none, auto, required]
            - type: object
              required:
                - type
                - function
              properties:
                type:
                  type: string
                  enum: [function]
                function:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
          description: |
            Controls which (if any) tool is called by the model.

    ChatCompletionMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [system, user, assistant, developer, function, tool, root]
          description: |
            The role of the message author. Use `tool` for a message that
            carries the result of a tool call (paired with `tool_call_id`).
            `root` is a model-gated vendor role accepted only when the model's
            tokenizer enables it.
        content:
          oneOf:
            - type: string
              description: |
                The content of the message as a string.
            - type: array
              description: |
                The content of the message as an array of content parts. For user messages, content parts can be of type text, image_url, or video_url.
              items:
                oneOf:
                  - type: object
                    required:
                      - type
                      - text
                    properties:
                      type:
                        type: string
                        enum: [text]
                        description: The type of the content part.
                      text:
                        type: string
                        description: The text content.
                  - type: object
                    required:
                      - type
                      - image_url
                    properties:
                      type:
                        type: string
                        enum: [image_url]
                        description: The type of the content part.
                      image_url:
                        type: object
                        required:
                          - url
                        properties:
                          url:
                            type: string
                            description: |
                              Either a URL of the image or a base64 encoded image with the data-uri scheme.
                          detail:
                            type: string
                            description: |
                              Optional quality tier. Mutually exclusive with
                              max_long_side_pixel.
                          max_long_side_pixel:
                            type: integer
                            minimum: 1
                            description: |
                              Optional sizing hint. Downscale the image so its
                              longest side is at most this many pixels.
                  - type: object
                    required:
                      - type
                      - video_url
                    properties:
                      type:
                        type: string
                        enum: [video_url]
                        description: The type of the content part.
                      video_url:
                        type: object
                        required:
                          - url
                        properties:
                          url:
                            type: string
                            description: |
                              Either a URL of the video or the base64 encoded video data.
                          fps:
                            type: number
                            exclusiveMinimum: 0
                            description: |
                              Optional sampling hint. Frames per second to
                              sample the video at.
                          max_frames:
                            type: integer
                            minimum: 1
                            description: |
                              Optional sampling hint. Maximum number of frames
                              to sample from the video.
                          detail:
                            type: string
                            description: |
                              Optional quality tier. Mutually exclusive with
                              max_long_side_pixel.
                          max_long_side_pixel:
                            type: integer
                            minimum: 1
                            description: |
                              Optional sizing hint. Downscale the video so its
                              longest side is at most this many pixels.
        reasoning:
          type: string
          description: |
            The reasoning model's chain-of-thought, populated in response
            messages when the model produces reasoning text. This is the
            default field; the opt-in `emit_reasoning_content` server
            config emits it under `reasoning_content` instead. Exactly one
            of the two is populated per response.
        reasoning_content:
          type: string
          description: |
            Alternate chain-of-thought field, populated in response
            messages instead of `reasoning` when the
            `emit_reasoning_content` server config is enabled (the naming
            used by vLLM, SGLang, and the DeepSeek API). Also accepted in
            request messages to pass prior reasoning back to the model.
        name:
          type: string
          description: |
            The name of the author of this message.
        tool_call_id:
          type: string
          description: |
            For a `tool` role message, the ID of the tool call this message
            responds to. Must match an `id` from a prior assistant message's
            `tool_calls`; a missing, mismatched, or incomplete set of tool
            replies is rejected with a 400 error.
        tool_calls:
          type: array
          description: |
            Tool calls generated by the model on an `assistant` message. Echo
            them back unchanged in the follow-up request, each paired with a
            `tool` role message whose `tool_call_id` matches the call's `id`.
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type: string
                enum: [function]
              function:
                type: object
                properties:
                  name:
                    type: string
                  arguments:
                    type: string
                    description: JSON-encoded string of the call arguments.

    ChatCompletionTool:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [function]
          description: The type of the tool
        function:
          $ref: '#/components/schemas/FunctionObject'
    FunctionObject:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 64
          description: |
            The name of the function to be called. Must be at most 64
            characters. The default character set is `[a-zA-Z0-9_-]`; some model
            parsers widen it to allow dotted or namespaced names (for example,
            `my-tool.v2`).
        description:
          type: string
          description: A description of what the function does
        parameters:
          type: object
          description: The parameters the function accepts, described as a JSON Schema object

    CreateChatCompletionResponse:
      type: object
      required:
        - id
        - object
        - created
        - model
        - choices
      properties:
        id:
          type: string
          description: A unique identifier for the chat completion
        object:
          type: string
          enum: [chat.completion]
          description: The object type, which is always `chat.completion`
        created:
          type: integer
          description: The Unix timestamp (in seconds) of when the chat completion was created
        model:
          type: string
          description: The model used for the chat completion
        choices:
          type: array
          items:
            $ref: '#/components/schemas/ChatCompletionChoice'
          description: |
            A list of chat completion choices.
            MAX does not support `finish_reason` and `logprobs` in choices.
        usage:
          $ref: '#/components/schemas/Usage'
          description: |
            Usage statistics for the completion request.

    ChatCompletionChoice:
      type: object
      required:
        - index
        - message
      properties:
        index:
          type: integer
          description: The index of the choice in the list of choices
        message:
          $ref: '#/components/schemas/ChatCompletionMessage'
          description: The chat completion message

    CreateCompletionRequest:
      type: object
      required:
        - model
        - prompt
      properties:
        model:
          type: string
          description: |
            ID of the model to use.
        prompt:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          description: |
            The prompt to generate completions for.
        echo:
          type: boolean
          default: false
          description: |
            Echo back the prompt in addition to the completion.
        max_tokens:
          type: integer
          minimum: 1
          description: |
            The maximum number of tokens to generate in the completion.
        stream:
          type: boolean
          default: false
          description: |
            Whether to stream back partial progress.
        logprobs:
          type: integer
          minimum: 0
          description: |
            Include the log probabilities on the logprobs most likely tokens.

    CreateCompletionResponse:
      type: object
      required:
        - id
        - object
        - created
        - model
        - choices
      properties:
        id:
          type: string
          description: A unique identifier for the completion
        object:
          type: string
          enum: [text_completion]
          description: The object type, which is always `text_completion`
        created:
          type: integer
          description: The Unix timestamp (in seconds) of when the completion was created
        model:
          type: string
          description: The model used for the completion
        choices:
          type: array
          items:
            $ref: '#/components/schemas/CompletionChoice'
          description: A list of completion choices
        usage:
          $ref: '#/components/schemas/Usage'
          description: |
            Usage statistics for the completion request.

    CompletionChoice:
      type: object
      required:
        - index
        - text
      properties:
        index:
          type: integer
          description: The index of the choice in the list of choices
        text:
          type: string
          description: The generated text
        finish_reason:
          type: string
          enum: [stop, length, content_filter, null]
          description: The reason the completion finished

    CreateEmbeddingRequest:
      type: object
      required:
        - model
        - input
      properties:
        model:
          type: string
          description: |
            ID of the model to use. MAX supports
            [sentence-transformers/all-mpnet-base-v2](https://huggingface.co/sentence-transformers/all-mpnet-base-v2).
        input:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          description: |
            The text to embed.
            MAX supports strings and list of strings.
        encoding_format:
          type: string
          enum: [float, base64]
          default: float
          description: |
            The format to return the embeddings in.
        dimensions:
          type: integer
          description: |
            The number of dimensions the resulting output embeddings should have.
        user:
          type: string
          description: |
            A unique identifier representing your end-user.

    CreateEmbeddingResponse:
      type: object
      required:
        - object
        - data
        - model
      properties:
        object:
          type: string
          enum: [list]
          description: The object type, which is always list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Embedding'
          description: A list of embeddings
        model:
          type: string
          description: The model used for the embeddings
        usage:
          $ref: '#/components/schemas/Usage'
          description: Usage statistics for the embedding request

    Embedding:
      type: object
      required:
        - object
        - embedding
        - index
      properties:
        object:
          type: string
          enum: [embedding]
          description: The object type, which is always embedding
        embedding:
          type: array
          items:
            type: number
            format: float
          description: The embedding vector
        index:
          type: integer
          description: The index of the embedding in the list of embeddings

    ListModelsResponse:
      type: object
      required:
        - object
        - data
      properties:
        object:
          type: string
          enum: [list]
          description: The object type, which is always list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Model'
          description: A list of model objects. MAX returns only one model.
    Model:
      type: object
      required:
        - id
        - object
        - created
        - owned_by
      properties:
        id:
          type: string
          description: The model identifier
        object:
          type: string
          enum: [model]
          description: The object type, which is always model
        created:
          type: integer
          description: The Unix timestamp (in seconds) of when the model was created
        owned_by:
          type: string
          description: The organization that owns the model
    Usage:
      type: object
      required:
        - prompt_tokens
        - completion_tokens
        - total_tokens
      properties:
        prompt_tokens:
          type: integer
          description: Number of tokens in the prompt
        completion_tokens:
          type: integer
          description: Number of tokens in the generated completion
        total_tokens:
          type: integer
          description: Total number of tokens used in the request (prompt + completion)
        completion_tokens_details:
          type: object
          description: |
            Breakdown of the generated completion tokens.
          properties:
            reasoning_tokens:
              type: integer
              description: |
                Tokens generated as model reasoning (chain of thought).
                Populated for reasoning models; otherwise 0.

    ErrorResponse:
      type: object
      description: |
        An error response from the MAX REST API.
      required:
        - error
      properties:
        error:
          type: object
          description: |
            The error object.
          required:
            - message
            - type
            - code
          properties:
