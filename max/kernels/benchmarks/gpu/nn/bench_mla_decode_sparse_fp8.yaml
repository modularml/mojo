# Sparse MLA decode over a paged FP8 latent cache, at speculative-decode
# verify widths.
#
# Usage:
#   kbench bench_mla_decode_sparse_fp8.yaml
#   kbench bench_mla_decode_sparse_fp8.yaml --param cache_len:"[2048]"

name: bench_mla_decode_sparse_fp8
file: $KERNEL_BENCHMARKS_ROOT/gpu/nn/bench_mla_decode_sparse_fp8.mojo

params:

# Both Q dtypes at the shape the sparse decode is tuned for. FP8 and BF16 Q
# reach different kernels, so this pair is the comparison, not a variant.
# cache_len 2042 saturates the window: cache_len + seq_len == top_k, past
# which the work per query position stops growing.
- num_heads: 8
  page_size: 128
  top_k: 2048
  seq_len: 6
  $q_dtype: [float8_e4m3fn, bfloat16]
  $batch_size: [8]
  $cache_len: [1024, 2042, 4096]

# Batch scaling at the saturated point. The split count is chosen against the
# SM count, so the wave structure changes across this axis.
- num_heads: 8
  page_size: 128
  top_k: 2048
  seq_len: 6
  q_dtype: float8_e4m3fn
  $batch_size: [1, 2, 4, 16, 32]
  $cache_len: [2042]

# Guard shapes: the single-position draft step, a narrower window, and the
# other page size the cache is configured with.
- num_heads: 8
  top_k: 2048
  q_dtype: float8_e4m3fn
  $page_size: [64, 128]
  $seq_len: [1, 6]
  $batch_size: [8]
  $cache_len: [2042]

- num_heads: 8
  page_size: 128
  seq_len: 6
  q_dtype: float8_e4m3fn
  $top_k: [512, 1024]
  $batch_size: [8]
  $cache_len: [4096]
