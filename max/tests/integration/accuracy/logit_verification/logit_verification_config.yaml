    # two orders above the bf16 entry's. Suggested by --find-tolerances on
    # 1x B200: 8.7e-02 / 6.6e-02, widened ~3x for cross-hardware headroom.
    # This gates catastrophic regressions, not precision drift: dropping a
    # weight scale family moves cosine distance to ~7e-01, comfortably over.
    # A vLLM golden of this checkpoint would give the tighter gate.
    cos_dist_threshold: 2.5e-01
    kl_div_threshold: 2.0e-01

  # FP8 KV-cache variant. The encoding table keeps a quantized checkpoint's
