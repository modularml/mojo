    encoding: float4_e2m1fnx2
    tags: [nvidia-only]
    torch_reference_is_unquantized_source: true
    # transformers cannot load a modelopt MIXED_PRECISION checkpoint, so the
    # oracle's torch side is the bf16 source model (`Qwen/Qwen3.8-27B`) this
