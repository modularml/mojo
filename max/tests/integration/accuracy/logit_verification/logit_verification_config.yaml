    # quantization, which is the same arithmetic on any device, so
    # cross-hardware spread is second order. 3.0e-01 still separates from the
    # ~7e-01 a dropped weight-scale family produces.
    cos_dist_threshold: 3.0e-01
    kl_div_threshold: 5.0e-01

