    # Suggested by --find-tolerances on 1x B200: 1.3e-01 / 2.2e-01, against the
    # bf16 entry's 8.7e-02 / 6.6e-02 -- the FP8 cache is the whole difference,
    # the two runs are otherwise the same checkpoint and reference. Widened ~2x
